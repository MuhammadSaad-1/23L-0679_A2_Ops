version: "3.8"

networks:
  visionguard_net:
    driver: bridge

volumes:
  postgres_data:
    name: visionguard_postgres_volume

services:
  # -------------------------------------------------------------
  # 1. Database Service (PostgreSQL 15 Slim)
  # -------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: visionguard_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-visionguard_db}
      POSTGRES_USER: ${DB_USER:-visionguard_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Named volume for persistent audit trail across restarts
      - postgres_data:/var/lib/postgresql/data
    networks:
      - visionguard_net
    # Security Requirement (Subtask 6.3): NO port published to the outside host!
    # The database is only exposed internally to the web service.
    expose:
      - "5432"
    # Readiness Health Check (Web app will wait for this to pass)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-visionguard_user} -d ${DB_NAME:-visionguard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------
  # 2. Web Application Service (Flask + Gunicorn)
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionguard_web
    restart: always
    environment:
      PORT: 5000
      DECISION_THRESHOLD: ${DECISION_THRESHOLD:-0.5}
      DATABASE_URL: postgresql://${DB_USER:-visionguard_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-visionguard_db}
      MODEL_PATH: task2_outputs/2.3_transfer_learning_best.keras
    ports:
      # Publish Flask web port to host machine
      - "${PORT:-5000}:5000"
    networks:
      - visionguard_net
    # Orchestration Requirement: Web app starts ONLY after db passes healthcheck
    depends_on:
      db:
        condition: service_healthy
