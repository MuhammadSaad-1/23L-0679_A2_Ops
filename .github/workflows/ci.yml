name: VisionGuard CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Linting and Unit Testing with Multi-Version Matrix
  # -------------------------------------------------------------
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Test Suite with Pytest
        env:
          DECISION_THRESHOLD: 0.5
          DATABASE_PATH: "database/visionguard_history.db"
        run: |
          pytest -v tests/

  # -------------------------------------------------------------
  # Job 2: Build & Verify Production Docker Image
  # -------------------------------------------------------------
  docker-build:
    name: Build & Verify Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t visionguard-app:${{ github.sha }} .

      - name: Test Run Container & Verify Health
        run: |
          # Start container in background
          docker run -d --name ci_app -p 5000:5000 visionguard-app:${{ github.sha }}
          
          # Wait 15 seconds for startup warm-up
          sleep 15
          
          # Query health endpoint
          curl -f http://localhost:5000/health || exit 1
          
          # Clean up
          docker stop ci_app
          docker rm ci_app
